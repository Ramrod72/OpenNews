[project]
name = "ableline-image-converter"
version = "0.1.0"
description = "Offline desktop batch image converter powered by ImageMagick"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.10"]

[project.gui-scripts]
ableline-image-converter = "ableline.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ableline = ["resources/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
