name: opennews

services:
  # One-shot database initialization: applies pending migrations, sets
  # SQLite to WAL mode, and syncs categories/sources/plans from config/.
  # `web` and `worker` never run any of this themselves (see
  # docker/entrypoint.sh) — doing it from two processes against the same
  # SQLite file at once previously raced and could fail with "database is
  # locked" (see docker/migrate.sh's own doc comment for the full
  # rationale).
  #
  # Deliberately NOT a `depends_on` of web/worker. A one-shot job and a
  # long-running service answer different questions for Compose:
  # `depends_on: condition: service_completed_successfully` means "has
  # this already run to completion in THIS invocation's view of the
  # project," which is re-evaluated every time Compose brings up a
  # dependent — including `docker compose up -d --force-recreate worker`
  # run on its own, long after the original migrate container is gone.
  # That re-ran migrate concurrently with an already-live `web`, which is
  # exactly the SQLite single-writer race this fix exists to prevent — see
  # DEPLOYMENT.md for the full incident and the explicit two-step deploy
  # procedure this requires instead.
  #
  # `profiles: ["init"]` keeps this out of a bare `docker compose up -d`
  # (whole stack, no service names) or `docker compose up -d <web|worker>`
  # entirely — it only ever runs when explicitly invoked with
  # `--profile init`, which is what makes "exactly when intentionally
  # deploying, never otherwise" a guarantee Compose itself enforces,
  # rather than something that depends on an operator never running a
  # bare `up`. `restart: "no"` is deliberate too: this container is meant
  # to exit 0 and stay stopped, never auto-restarted.
  migrate:
    profiles: ["init"]
    build: .
    image: opennews:latest
    restart: "no"
    entrypoint: ["./docker/migrate.sh"]
    environment:
      DATABASE_URL: "file:/data/opennews.db"
    volumes:
      - opennews-data:/data

  web:
    build: .
    image: opennews:latest
    restart: unless-stopped
    ports:
      # Bound to loopback only: this app has no TLS of its own and must
      # never be reached directly from the public Internet in plaintext
      # (see DEPLOYMENT.md's "Reverse proxy + HTTPS" section, required
      # reading before production use). A reverse proxy on the SAME host
      # reaches it via 127.0.0.1:3000 exactly as shown there; a reverse
      # proxy running as ANOTHER container on this compose network reaches
      # it via the internal service name/port (http://web:3000) instead,
      # which this binding does not affect at all.
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: "file:/data/opennews.db"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env, e.g. via: openssl rand -base64 32}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      AI_PROVIDER: "${AI_PROVIDER:-none}"
      AI_BASE_URL: "${AI_BASE_URL:-http://host.docker.internal:11434}"
      AI_MODEL: "${AI_MODEL:-llama3.1}"
      NODE_ENV: production
    volumes:
      - opennews-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: .
    image: opennews:latest
    restart: unless-stopped
    command: ["npx", "tsx", "worker/index.ts"]
    depends_on:
      web:
        condition: service_healthy
    environment:
      DATABASE_URL: "file:/data/opennews.db"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
      AI_PROVIDER: "${AI_PROVIDER:-none}"
      AI_BASE_URL: "${AI_BASE_URL:-http://host.docker.internal:11434}"
      AI_MODEL: "${AI_MODEL:-llama3.1}"
      WORKER_CRON: "${WORKER_CRON:-*/5 * * * *}"
      NODE_ENV: production
    volumes:
      - opennews-data:/data

# --- Optional: swap SQLite for PostgreSQL in production ---
# 1. Uncomment the `postgres` service below.
# 2. Change `provider = "sqlite"` to `provider = "postgresql"` in prisma/schema.prisma.
# 3. Set DATABASE_URL on both services to:
#      postgresql://opennews:opennews@postgres:5432/opennews
# 4. Run `npx prisma migrate dev` locally once against Postgres to regenerate
#    the migrations, then rebuild the image.
#
# postgres:
#   image: postgres:16-alpine
#   restart: unless-stopped
#   environment:
#     POSTGRES_USER: opennews
#     POSTGRES_PASSWORD: opennews
#     POSTGRES_DB: opennews
#   volumes:
#     - opennews-postgres:/var/lib/postgresql/data

volumes:
  opennews-data:
  # opennews-postgres:
