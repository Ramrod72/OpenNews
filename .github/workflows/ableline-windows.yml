name: Ableline Image Converter (Windows build)

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/ableline-image-converter/**"
      - ".github/workflows/ableline-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: desktop/ableline-image-converter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download ImageMagick 7 portable (Q16, x64) from official GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          # Official distribution: release assets of github.com/ImageMagick/ImageMagick.
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $releases = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/ImageMagick/ImageMagick/releases?per_page=15"
          $asset = $null
          foreach ($r in $releases | Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -like "7.*" }) {
            $asset = $r.assets | Where-Object { $_.name -match '-portable-Q16-x64\.(zip|7z)$' } | Select-Object -First 1
            if ($asset) { Write-Host "Release $($r.tag_name): $($asset.name)"; break }
            Write-Host "Release $($r.tag_name) has no portable Q16 x64 asset; assets: $(($r.assets.name) -join ', ')"
          }
          if (-not $asset) { throw "No ImageMagick 7 portable Q16 x64 asset found in recent releases." }

          # SHA-256 computed by GitHub for the uploaded asset.
          if ($asset.digest -notmatch '^sha256:([0-9a-fA-F]{64})$') { throw "No SHA-256 digest published for $($asset.name)" }
          $expected = $Matches[1].ToUpper()
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -UseBasicParsing $asset.browser_download_url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "SHA-256 mismatch for $($asset.name): expected $expected, got $actual" }
          Write-Host "SHA-256 verified: $actual"

          $dest = Join-Path $env:RUNNER_TEMP "im"
          7z x $archive "-o$dest" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Extraction failed" }
          $exe = Get-ChildItem $dest -Recurse -Filter magick.exe | Select-Object -First 1
          if (-not $exe) { throw "magick.exe not found in $($asset.name)" }
          Write-Host "ImageMagick folder: $($exe.DirectoryName)"
          Get-ChildItem $exe.DirectoryName -Filter *.txt | ForEach-Object { Write-Host "  $($_.Name)" }
          "IM_DIR=$($exe.DirectoryName)" | Out-File -Append $env:GITHUB_ENV

      - name: Test and build
        run: ./packaging/build_windows.ps1 -ImageMagickDir $env:IM_DIR

      - name: Smoke test the executable
        run: |
          $exe = "dist\AblelineImageConverter\AblelineImageConverter.exe"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Executable exited early with code $($p.ExitCode)" }
          Stop-Process $p.Id
          Write-Host "Executable started and stayed running."

      - uses: actions/upload-artifact@v4
        with:
          name: AblelineImageConverter-windows-x64
          path: desktop/ableline-image-converter/dist/AblelineImageConverter
          if-no-files-found: error
